<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arma &amp; Heroes — Battles</title><link rel="stylesheet" href="/style.css"></head><body>
<main><div class="grid"><div>
<div class="panel"><h2>Ongoing battles</h2><div id="live"></div></div>
<div class="panel"><h2>History</h2><div id="hist"></div></div></div>
<div><div class="panel"><h2>Details</h2><div id="det" class="muted">Select a battle.</div></div></div></div></main>
<script src="/common.js"></script><script>
const row = b => `<tr style="cursor:pointer" onclick="detail('${b.battleId}')"><td>${b.battleId}</td><td>${esc(b.cityName)}</td><td><span class="${b.attacker}">${b.attacker}</span> ⟶ <span class="${b.defender}">${b.defender}</span></td>
 <td>${STLABEL[b.status]}${b.winner ? ' — <b class="' + b.winner + '">' + b.winner + '</b>' : ''}</td><td>${b.tickets[b.attacker] || 0} / ${b.tickets[b.defender] || 0}</td><td class="muted">${fmtDate(b.createdAt)}</td></tr>`;
const tbl = l => l.length ? '<table><tr><th>ID</th><th>City</th><th>Att. ⟶ Def.</th><th>Status</th><th>Tickets</th><th>Created</th></tr>' + l.map(row).join('') + '</table>' : '<p class="muted">None.</p>';
async function load() {
  live.innerHTML = tbl(await api('/battles?status=pending,starting,running'));
  hist.innerHTML = tbl(await api('/battles?status=finished,cancelled&limit=50'));
}
async function detail(id) {
  location.hash = id;
  const b = await api('/battles/' + id + '/detail'), c = b.config;
  let h = `<b>${b.battleId} — ${esc(b.cityName)}</b><br>Mode ${c.mode} · ${c.timeLimitMin} min · ${STLABEL[b.status]}<br><span class="muted">Scenario ${esc(c.scenario)}<br>Server: ${esc(b.serverInstance || '—')} · last heartbeat ${fmtDate(b.heartbeatAt)}</span>`;
  for (const f of [c.attacker, c.defender]) {
    const ai = c.sides[f].ai || {};
    h += `<h3 class="${f}">${FNAME[f]} ${f === c.attacker ? '(attacking)' : '(defending)'}</h3><div class="muted">AI bots: ${ai.enabled ? 'on, max ' + ai.maxAlive + ' alive, x' + ai.perPlayerScale + ' per player' : 'off'}</div><table>` + c.sides[f].teams.map(t =>
      `<tr><td>${t.teamId}</td><td>${TLABEL[t.type] || t.type}</td><td>${t.manpower} men</td><td class="muted">${t.vehicles.map(v => v.count + '× ' + v.key).join(', ')}</td></tr>`).join('') + '</table>';
  }
  if (b.result) {
    const r = b.result;
    const pc = s => (r.players || []).filter(p => p.side === s).length;
    h += '<p>' + [c.attacker, c.defender].map(s => `<span class="${s}">${s}</span>: Players ${pc(s)} · AI ${(r.aiDeaths || {})[s] ?? '—'} lost / ${(r.aiKills || {})[s] ?? '—'} kills`).join('<br>') + '</p>';
    h += `<h3>Result: <span class="${r.winner}">${FNAME[r.winner]}</span> (${r.reason}, ${Math.round(r.durationSec / 60)} min)</h3>`;
    h += '<table><tr><th>Player</th><th>Side</th><th>K</th><th>D</th><th>Cap.</th><th>XP</th></tr>' + (r.players || []).sort((a, b) => b.xp - a.xp).map(p =>
      `<tr><td>${esc(p.name)}</td><td class="${p.side}">${p.side}</td><td>${p.kills}</td><td>${p.deaths}</td><td>${p.captures}</td><td>${p.xp}</td></tr>`).join('') + '</table>';
  }
  if (b.live) h += `<h3>Live data</h3><pre style="white-space:pre-wrap;font-size:12px">${esc(JSON.stringify(b.live, null, 1))}</pre>`;
  det.innerHTML = h;
}
initPage('battles.html').then(() => { load(); setInterval(load, 15000); if (location.hash.length > 1) detail(location.hash.slice(1)); });
</script></body></html>

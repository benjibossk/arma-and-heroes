<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arma &amp; Heroes — Profile</title><link rel="stylesheet" href="/style.css"></head><body>
<main><div class="grid"><div class="panel"><h2>Leaderboard</h2>
<div class="row"><select id="ff" onchange="board()"><option value="">All factions</option><option value="US">Allies</option><option value="GER">Axis</option></select></div><div id="lb" class="scroll"></div></div>
<div><div class="panel"><h2>Service record</h2><div id="prof" class="muted">Log in or pick a player.</div></div>
<div class="panel" id="mine" style="display:none"><h2>My account</h2>
<div id="facrow" class="row" style="display:none">Choose my side: <button onclick="fac('US')">Allies</button><button onclick="fac('GER')">Axis</button></div>
<div id="linkrow"></div><div id="msg" class="muted"></div></div></div></div></main>
<script src="/common.js"></script><script>
async function board() {
  const l = await api('/players' + (ff.value ? '?faction=' + ff.value : ''));
  lb.innerHTML = '<table><tr><th>#</th><th>Name</th><th>Rank</th><th>Side</th><th>XP</th><th>K/D</th><th>Battles</th></tr>' + l.map((p, i) =>
    `<tr style="cursor:pointer" onclick="show(${p.id})"><td>${i + 1}</td><td>${esc(p.name)}</td><td>${esc(p.rank)}</td><td class="${p.faction}">${p.faction || '—'}</td><td>${p.xp}</td><td>${p.kills}/${p.deaths}</td><td>${p.battles}</td></tr>`).join('') + '</table>';
}
async function show(id) {
  const d = await api('/players/' + id), p = d.player;
  prof.innerHTML = `<b style="font-size:18px">${esc(p.name)}</b> <span class="${p.faction}">${FNAME[p.faction] || 'no side'}</span><br>${esc(d.rank)} · ${esc(p.role)}<br>
   XP ${p.xp} · credits ${p.credits}<br>Kills ${p.kills} · deaths ${p.deaths} · captures ${p.captures} · battles ${p.battles}<br><span class="muted">Game profile: ${p.identityId ? 'linked' : 'not linked'}</span>
   <h3>Recent battles</h3><table>${d.history.map(h => `<tr><td><a href="/battles.html#b_${String(h.battleId).padStart(6, '0')}">b_${String(h.battleId).padStart(6, '0')}</a></td><td class="${h.side}">${h.side}</td><td>${h.kills}/${h.deaths}</td><td>+${h.xp} XP</td></tr>`).join('')}</table>`;
}
async function fac(f) { try { await api('/me/faction', { method: 'POST', body: { faction: f } }); location.reload(); } catch (e) { msg.textContent = e.message; } }
initPage('profile.html').then(me => { board(); if (me) { mine.style.display = ''; if (!me.faction) facrow.style.display = '';
  linkrow.innerHTML = me.linked ? '<p class="ok">Game profile linked.</p>' : '<p>Game profile not linked. <a href="/link.html">Link your game account</a></p>'; show(me.id); } });
</script></body></html>

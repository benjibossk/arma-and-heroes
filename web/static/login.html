<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arma &amp; Heroes — Log in</title><link rel="stylesheet" href="/style.css"></head><body>
<main style="max-width:460px">
<div class="panel"><h2>Report to HQ</h2>
<p>Players log in with their Discord account. New here? <a href="/about.html">See what the project is</a>.</p>
<a id="dl" href="#"><button type="button" class="btn-big">Log in with Discord</button></a>
<p id="derr" class="err"></p></div>
<details class="panel"><summary class="muted">Administrator login</summary>
<form id="f"><div class="row"><input id="n" placeholder="Admin name" required style="flex:1" autocomplete="username"></div>
<div class="row"><input id="p" type="password" placeholder="Password" required style="flex:1" autocomplete="current-password"></div>
<div class="row"><button>Log in</button><span id="e" class="err"></span></div></form></details></main>
<script src="/common.js"></script><script>
initPage('');
const next = new URLSearchParams(location.search).get('next') || '/';
dl.href = discordLogin(next);
api('/auth/config').then(c => { if (!c.discord) { derr.textContent = 'Discord login is not configured on this server yet.'; dl.style.pointerEvents = 'none'; dl.style.opacity = .5; } });
f.onsubmit = async ev => { ev.preventDefault(); try { await api('/auth/login', { method: 'POST', body: { name: n.value, password: p.value } }); location.href = next; } catch (x) { e.textContent = x.message; } };
</script></body></html>
